plugins {
    id 'com.android.application'
}

// Identifiants de signature release, chargés depuis un fichier LOCAL, jamais
// commité (voir .gitignore) — le mot de passe ne doit jamais atterrir dans le
// dépôt, même privé. keystore.properties.example documente la forme attendue
// pour quiconque recloner ce repo devrait recréer sa propre clé.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.maxencerider.game'
    compileSdk 36

    defaultConfig {
        applicationId "com.maxencerider.game"
        minSdk 21
        targetSdk 36
        versionCode 5
        versionName "1.0.4"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
}
