<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12131A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Maxence Rider</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="jeu" aria-label="Aire de jeu"></canvas>

<!-- Contrôles et menus en DOM : ils restent lisibles par le clavier et les
     lecteurs d'écran, et se calent tout seuls sur les safe-areas iOS. -->
<div id="ui">
  <button id="pause" type="button" aria-label="Pause">II</button>
</div>

<p id="chargement" role="status">Chargement…</p>
<p id="panne" hidden></p>

<script>
// Les modules ES sont bloqués par CORS en file:// : on bascule alors sur le
// bundle concaténé (node tools/bundle.mjs). Même code, même comportement.
(function () {
  var s = document.createElement('script');
  if (location.protocol === 'file:') {
    s.src = 'dist/bundle.js';
    s.onerror = function () {
      var p = document.getElementById('panne');
      p.hidden = false;
      p.textContent = 'Ouvert en file:// sans bundle. Lance « node tools/bundle.mjs », '
        + 'ou sers le dossier avec « python3 -m http.server ».';
      document.getElementById('chargement').hidden = true;
    };
  } else {
    s.type = 'module';
    s.src = 'src/main.js';
  }
  document.head.appendChild(s);
})();
</script>

</body>
</html>
